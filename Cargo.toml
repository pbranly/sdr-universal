[package]
name = "sdr-universal"
version = "0.0.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Gateway that exposes an SDRplay RSP1B as an rtl_tcp server"
repository = "https://github.com/pbranly/sdr-universal"
readme = "README.md"
keywords = ["sdr", "sdrplay", "rtl-tcp", "dab", "rsp1b"]

build = "build.rs"

[features]
# SDRplay backend. The SDRplay API (libsdrplay_api) is loaded at run time:
# nothing to install to build. Without this feature only --mock is available.
default = ["sdrplay"]
sdrplay = []

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
ctrlc = "3.4"
log = { version = "0.4", features = ["std"] }
mdns-sd = "0.13"
libloading = "0.8"

[profile.release]
# Binary without debug symbols: about 0.8 MB instead of 14 MB.
strip = true
