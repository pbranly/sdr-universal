[package]
name = "sdr-universal"
version = "0.0.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Gateway that exposes an SDRplay RSP1B as an rtl_tcp server"
repository = "https://github.com/pbranly/sdr-universal"
readme = "README.md"
keywords = ["sdr", "sdrplay", "rtl-tcp", "dab", "rsp1b"]

build = "build.rs"

[features]
# Backend SDRplay. L'API SDRplay (libsdrplay_api) est chargée à l'exécution :
# rien à installer pour compiler. Sans cette feature, seul --mock est disponible.
default = ["sdrplay"]
sdrplay = []

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
ctrlc = "3.4"
libloading = "0.8"

[profile.release]
# Binaire sans symboles de débogage : environ 0,8 Mo au lieu de 14 Mo.
strip = true
