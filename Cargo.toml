[package]
name = "sdr-universal"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Gateway that exposes an SDRplay RSP1B as an rtl_tcp server"
repository = "https://github.com/pbranly/sdr-universal"
readme = "README.md"
keywords = ["sdr", "sdrplay", "rtl-tcp", "dab", "rsp1b"]

build = "build.rs"

[features]
# Backend SDRplay (nécessite libsdrplay_api). Sans lui : `cargo build --no-default-features`
# et lancement avec --mock.
default = ["sdrplay"]
sdrplay = []

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
ctrlc = "3.4"
