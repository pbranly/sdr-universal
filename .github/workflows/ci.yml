name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # End-to-end tests run against the simulated receiver: no RSP and no
      # SDRplay API are needed.
      - name: Test
        run: cargo test

      - name: Build without the SDRplay backend
        run: cargo check --no-default-features

  # Style and lint checks. Pinned to the toolchain they were verified with, so that a
  # new Rust release adding lints cannot turn the build red by surprise: update the
  # version on purpose, and fix what the new lints report.
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # The minimum Rust version declared in Cargo.toml (`rust-version`) must keep building.
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.78

      - uses: Swatinem/rust-cache@v2

      - name: Build with the minimum supported Rust
        run: cargo build --locked
