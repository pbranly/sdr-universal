name: Release .deb

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.2.3). Leave empty to only build test packages, without a release."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Build exactly the tag that is being published (manual runs included).
          ref: ${{ inputs.tag || github.ref }}
          # Full history and tags: the version shown by `sdr-universal --version`.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Determine version
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          if [ -n "$TAG" ]; then
            CARGO_VERSION="${TAG#v}"
            if [[ ! "$CARGO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid tag '$TAG' (expected vMAJOR.MINOR.PATCH, e.g. v1.2.3)"
              exit 1
            fi
            VERSION="$CARGO_VERSION"
          else
            # Manual run without a tag: test package, never published.
            CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            VERSION="${CARGO_VERSION}+ci${GITHUB_RUN_NUMBER}"
          fi

          echo "cargo_version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION (Cargo version: $CARGO_VERSION)"

      - name: Set version in Cargo.toml
        shell: bash
        env:
          CARGO_VERSION: ${{ steps.ver.outputs.cargo_version }}
        run: |
          set -euo pipefail
          # Only the first `version = "..."` line: the package version.
          sed -i '0,/^version = ".*"/s//version = "'"$CARGO_VERSION"'"/' Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Run tests (simulated receiver, no hardware)
        shell: bash
        run: cargo test --release

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_VERSION: ${{ steps.ver.outputs.cargo_version }}
        run: |
          set -euxo pipefail

          export SDR_UNIVERSAL_GIT="$(git describe --tags --always)"
          cargo build --release --target "$TARGET"

          BIN="target/${TARGET}/release/sdr-universal"
          file "$BIN"

          # The SDRplay API is proprietary and loaded at run time: the binary
          # must not depend on it.
          if ldd "$BIN" | grep -qi sdrplay; then
            echo "::error::The binary is linked against the SDRplay API"
            exit 1
          fi

          VERSION_LINE="$("$BIN" --version)"
          echo "$VERSION_LINE"
          case "$VERSION_LINE" in
            "sdr-universal ${CARGO_VERSION} "*) ;;
            *) echo "::error::--version does not report ${CARGO_VERSION}"; exit 1 ;;
          esac

      - name: Build .deb package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          bash packaging/build-deb.sh "$VERSION" "$ARCH" "target/${TARGET}/release/sdr-universal" target/deb
          dpkg-deb -I target/deb/*.deb
          dpkg-deb -c target/deb/*.deb

      - name: Lint package
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --fail-on error target/deb/*.deb

      - name: Smoke test (install, run, remove)
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get install -y ./target/deb/*.deb
          sdr-universal --version

          # Simulated receiver: no hardware and no SDRplay API needed.
          sdr-universal --mock --port 26000 > mock.log 2>&1 &
          sleep 5
          grep -q "MOCK MODE" mock.log
          pkill -INT -x sdr-universal
          sleep 4
          grep -q "clean shutdown" mock.log

          sudo apt-get remove -y sdr-universal

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdr-universal-${{ matrix.arch }}
          path: target/deb/sdr-universal_*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: sdr-universal-*
          merge-multiple: true
          path: release

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum ./*.deb | sed 's# \./# #' > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release/*.deb
            release/SHA256SUMS
          generate_release_notes: true
