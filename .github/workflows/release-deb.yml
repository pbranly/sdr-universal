name: Release .deb

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Get package version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          if [ -z "$VERSION" ]; then
            echo "ERROR: unable to determine package version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Install SDRplay API (for linking)
        shell: bash
        run: |
          set -e

          echo "Installing SDRplay API..."

          if curl -fsSL https://www.sdrplay.com/software/install.sh \
              -o /tmp/sdrplay-install.sh; then

            if sudo ACCEPTLICENSE=1 bash /tmp/sdrplay-install.sh; then
              echo "SDRplay API installer completed."
            else
              echo "::warning::SDRplay installer failed or is unavailable in CI."
              echo "::warning::Building with --no-default-features (mock backend only)."
              echo "MOCK_ONLY=1" >> "$GITHUB_ENV"
            fi

          else
            echo "::warning::Unable to download SDRplay installer."
            echo "::warning::Building with --no-default-features (mock backend only)."
            echo "MOCK_ONLY=1" >> "$GITHUB_ENV"
          fi

          if [ -f /usr/local/lib/libsdrplay_api.so ]; then
            sudo ldconfig

            echo "SDRplay library:"
            ls -la /usr/local/lib/libsdrplay_api* || true

            echo "SDRplay header:"
            ls -la /usr/local/include/sdrplay_api.h || true
          else
            echo "libsdrplay_api.so not found."
          fi

      - name: Set package version in Cargo.toml
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/^version = ".*"/version = "${{ steps.ver.outputs.version }}"/' \
            Cargo.toml

          echo "Cargo.toml version:"
          grep '^version' Cargo.toml

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail

          echo "Target: ${{ matrix.target }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "MOCK_ONLY=${MOCK_ONLY:-0}"

          if [ "${MOCK_ONLY:-0}" = "1" ]; then
            cargo build \
              --release \
              --no-default-features \
              --target "${{ matrix.target }}"
          else
            cargo build \
              --release \
              --target "${{ matrix.target }}"
          fi

          BIN="target/${{ matrix.target }}/release/sdr-universal"

          echo "Checking binary:"
          ls -la "$BIN"
          file "$BIN"

      - name: Build .deb package
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"

          BIN="target/${TARGET}/release/sdr-universal"
          PKG_DIR="packaging/deb-root"
          DEB_NAME="sdr-universal_${VERSION}_${ARCH}.deb"

          echo "========================================"
          echo "Building Debian package"
          echo "VERSION = ${VERSION}"
          echo "ARCH    = ${ARCH}"
          echo "TARGET  = ${TARGET}"
          echo "BIN     = ${BIN}"
          echo "PKG_DIR = ${PKG_DIR}"
          echo "DEB     = ${DEB_NAME}"
          echo "========================================"

          echo "Checking required files..."

          test -f "$BIN"
          test -f LICENSE
          test -f README.md

          echo "Binary:"
          ls -la "$BIN"

          echo "LICENSE:"
          ls -la LICENSE

          echo "README:"
          ls -la README.md

          echo "Cleaning previous package tree..."

          rm -rf "$PKG_DIR"

          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/doc/sdr-universal"

          echo "Installing binary..."

          install -m 755 \
            "$BIN" \
            "$PKG_DIR/usr/bin/sdr-universal"

          echo "Installing documentation..."

          cp LICENSE \
            "$PKG_DIR/usr/share/doc/sdr-universal/copyright"

          cp README.md \
            "$PKG_DIR/usr/share/doc/sdr-universal/"

          DEPENDS="libc6"

          cat > "$PKG_DIR/DEBIAN/control" << EOF
Package: sdr-universal
Version: ${VERSION}
Section: hamradio
Priority: optional
Architecture: ${ARCH}
Maintainer: pbranly <https://github.com/pbranly>
Depends: ${DEPENDS}
Homepage: https://github.com/pbranly/sdr-universal
Description: rtl_tcp gateway for SDRplay RSP1B
 Exposes an SDRplay RSP1B as an rtl_tcp server so that software
 written for RTL-SDR (e.g. AbracaDABra) can use the RSP with
 correct per-band gain, RF level and bandwidth selection.
 .
 Requires the SDRplay API 3.x (libsdrplay_api) installed from
 https://www.sdrplay.com/software/install.sh and the service
 sdrplay_apiService running.
 EOF

          echo "Debian control file:"
          cat "$PKG_DIR/DEBIAN/control"

          cat > "$PKG_DIR/DEBIAN/postinst" << 'POSTINST'
#!/bin/sh
set -e

if ! ldconfig -p 2>/dev/null | grep -q libsdrplay_api; then
    echo "sdr-universal: warning: libsdrplay_api not found."
    echo "  Install the SDRplay API 3.x:"
    echo "  curl -fsSL https://www.sdrplay.com/software/install.sh | sudo bash"
    echo "  Then ensure sdrplay_apiService is running."
fi

exit 0
POSTINST

          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          echo "Package tree:"
          find "$PKG_DIR" -type f -o -type d | sort

          mkdir -p packaging

          echo "Building .deb..."

          fakeroot dpkg-deb \
            --build \
            "$PKG_DIR" \
            "packaging/${DEB_NAME}"

          echo "========================================"
          echo "dpkg-deb information"
          echo "========================================"

          dpkg-deb -I "packaging/${DEB_NAME}"

          echo "========================================"
          echo "dpkg-deb contents"
          echo "========================================"

          dpkg-deb -c "packaging/${DEB_NAME}"

          echo "========================================"
          echo "Package successfully built:"
          ls -lh "packaging/${DEB_NAME}"
          echo "========================================"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdr-universal-${{ matrix.arch }}
          path: packaging/sdr-universal_*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-deb
    runs-on: ubuntu-24.04

    steps:

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: sdr-universal-amd64
          path: release

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: sdr-universal-arm64
          path: release

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail

          echo "Release files:"
          find release -type f -maxdepth 2 -print -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
          generate_release_notes: true
