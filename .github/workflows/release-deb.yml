name: Release .deb

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.2.3) — laisser vide pour ne pas créer de release"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Get package version from Git tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "ERROR: no Git tag specified"
            exit 1
          fi

          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid tag/version: $TAG"
            echo "Expected format: v1.2.3"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Git tag: $TAG"
          echo "Package version: $VERSION"

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Set package version in Cargo.toml
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/^version = ".*"/version = "${{ steps.ver.outputs.version }}"/' \
            Cargo.toml

          echo "Cargo.toml version:"
          grep '^version' Cargo.toml

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail

          echo "Target: ${{ matrix.target }}"
          echo "Architecture: ${{ matrix.arch }}"

          cargo build \
            --release \
            --target "${{ matrix.target }}"

          BIN="target/${{ matrix.target }}/release/sdr-universal"

          echo "Checking binary:"
          ls -la "$BIN"
          file "$BIN"

          echo "Checking SDRplay dynamic dependency:"
          if ldd "$BIN" 2>/dev/null | grep -qi sdrplay; then
            echo "::error::Binary is unexpectedly linked against SDRplay API"
            exit 1
          fi

          echo "OK: no static SDRplay dependency in binary"

      - name: Build .deb package
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"

          BIN="target/${TARGET}/release/sdr-universal"
          PKG_DIR="packaging/deb-root"
          DEB_NAME="sdr-universal_${VERSION}_${ARCH}.deb"

          echo "========================================"
          echo "Building Debian package"
          echo "VERSION = ${VERSION}"
          echo "ARCH    = ${ARCH}"
          echo "TARGET  = ${TARGET}"
          echo "BIN     = ${BIN}"
          echo "PKG_DIR = ${PKG_DIR}"
          echo "DEB     = ${DEB_NAME}"
          echo "========================================"

          echo "Checking required files..."

          test -f "$BIN"
          test -f LICENSE
          test -f README.md

          echo "Binary:"
          ls -la "$BIN"

          echo "LICENSE:"
          ls -la LICENSE

          echo "README:"
          ls -la README.md

          echo "Cleaning previous package tree..."

          rm -rf "$PKG_DIR"

          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/doc/sdr-universal"

          echo "Installing binary..."

          install -m 755 \
            "$BIN" \
            "$PKG_DIR/usr/bin/sdr-universal"

          echo "Installing documentation..."

          cp LICENSE \
            "$PKG_DIR/usr/share/doc/sdr-universal/copyright"

          cp README.md \
            "$PKG_DIR/usr/share/doc/sdr-universal/"

          DEPENDS="libc6"

          cat > "$PKG_DIR/DEBIAN/control" << EOF
          Package: sdr-universal
          Version: ${VERSION}
          Section: hamradio
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: pbranly <https://github.com/pbranly>
          Depends: ${DEPENDS}
          Homepage: https://github.com/pbranly/sdr-universal
          Description: rtl_tcp gateway for SDRplay RSP1B
           Exposes an SDRplay RSP1B as an rtl_tcp server so that software
           written for RTL-SDR (e.g. AbracaDABra) can use the RSP with
           correct per-band gain, RF level and bandwidth selection.
           .
           Requires the SDRplay API 3.x (libsdrplay_api) installed from
           https://www.sdrplay.com/software/install.sh and the service
           sdrplay_apiService running.
          EOF

          echo "Debian control file:"
          cat "$PKG_DIR/DEBIAN/control"

          cat > "$PKG_DIR/DEBIAN/postinst" << 'POSTINST'
          #!/bin/sh
          set -e

          if ! ldconfig -p 2>/dev/null | grep -q libsdrplay_api; then
              echo "sdr-universal: warning: libsdrplay_api not found."
              echo "  Install the SDRplay API 3.x:"
              echo "  curl -fsSL https://www.sdrplay.com/software/install.sh | sudo bash"
              echo "  Then ensure sdrplay_apiService is running."
          fi

          exit 0
          POSTINST

          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          echo "Package tree:"
          find "$PKG_DIR" -type f -o -type d | sort

          mkdir -p packaging

          echo "Building .deb..."

          fakeroot dpkg-deb \
            --build \
            "$PKG_DIR" \
            "packaging/${DEB_NAME}"

          echo "========================================"
          echo "dpkg-deb information"
          echo "========================================"

          dpkg-deb -I "packaging/${DEB_NAME}"

          echo "========================================"
          echo "dpkg-deb contents"
          echo "========================================"

          dpkg-deb -c "packaging/${DEB_NAME}"

          echo "========================================"
          echo "Package successfully built:"
          ls -lh "packaging/${DEB_NAME}"
          echo "========================================"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdr-universal-${{ matrix.arch }}
          path: packaging/sdr-universal_*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-24.04

    steps:

      - name: Download amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: sdr-universal-amd64
          path: release

      - name: Download arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: sdr-universal-arm64
          path: release

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail

          echo "Release files:"
          find release -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*.deb
          generate_release_notes: true
